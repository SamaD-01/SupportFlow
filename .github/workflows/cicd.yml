name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
          POSTGRES_DB: supportflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U supportflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, zip, intl
          coverage: none

      - name: Installer les dépendances
        working-directory: backend
        run: composer install --prefer-dist --no-progress

      - name: Préparer la base de test
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
        env:
          DATABASE_URL: "postgresql://supportflow:supportflow@127.0.0.1:5432/supportflow_test"

      - name: Lancer les tests
        working-directory: backend
        run: vendor/bin/phpunit
        env:
          DATABASE_URL: "postgresql://supportflow:supportflow@127.0.0.1:5432/supportflow_test"

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Installer les dépendances
        working-directory: client
        run: npm ci
      - name: Lint
        working-directory: client
        run: npm run lint --if-present
      - name: Build Vite
        working-directory: client
        run: npm run build

  build-and-push:
    needs: [test-backend, test-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image backend (php-fpm)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/supportflow-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/supportflow-backend:latest

      - name: Build & push image nginx (front + proxy)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/supportflow-nginx:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/supportflow-nginx:latest
