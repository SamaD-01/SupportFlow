services:
  database:
    image: postgres:17-alpine
    container_name: supportflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow
    ports:
      - "5433:5432"
    volumes:
      - supportflow_database:/var/lib/postgresql/data

volumes:
  supportflow_database: