apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: supportflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supportflow-backend
  template:
    metadata:
      labels:
        app: supportflow-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/samad-01/supportflow-backend:latest
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: supportflow-config
            - secretRef:
                name: supportflow-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# Le nom du Service DOIT être "backend" : c'est ce nom que nginx utilise
# dans fastcgi_pass backend:9000 (voir docker/nginx/default.conf).
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: supportflow-backend
  ports:
    - port: 9000
      targetPort: 9000